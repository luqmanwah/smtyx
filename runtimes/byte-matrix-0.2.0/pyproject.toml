[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smtyx-runtime"
version = "0.2.0"
description = "SMTYX SMALL fingerprints, LARGE hierarchy, and exact cluster reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "luqmanwah"}]
dependencies = []

[project.scripts]
smtyx = "smtyx.__main__:main"

[tool.setuptools]
packages = ["smtyx"]
